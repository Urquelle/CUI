<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{{cspMeta}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{media}}/designer.css">
<title>CUI Designer</title>
</head>
<body data-wasm="{{media}}/designer.wasm">
<div id="app">
  <!-- the panels start in their default places; media/layout.js moves them into columns -->
  <div class="dock" id="dock-left">
    <section class="panel" data-panel="components" data-title="Components">
      <header class="panel-head" title="Drag to move the panel"><span class="grip"></span><h2>Components</h2></header>
      <div id="palette"></div>
    </section>
    <section class="panel" data-panel="outline" data-title="Outline">
      <header class="panel-head" title="Drag to move the panel"><span class="grip"></span><h2>Outline</h2></header>
      <div id="outline" role="tree"></div>
    </section>
  </div>
  <main id="center">
    <div id="toolbar">
      <div class="seg" role="radiogroup" aria-label="Mode">
        <button data-mode="design" class="on" title="Select, drag and drop (D)">Design</button>
        <button data-mode="test" title="Use the UI like the app (T)">Try it</button>
      </div>
      <label>W <input id="pw" type="number" min="120" max="4000" step="10"></label>
      <label>H <input id="ph" type="number" min="80" max="4000" step="10"></label>
      <select id="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option></select>
      <select id="accent" aria-label="Accent"></select>
      <select id="zoom" aria-label="Zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select>
      <span class="fill"></span>
      <button id="gen" title="Write the .ui.h and .ui.c files next to the design">Generate C</button>
    </div>
    <div id="stage">
      <div id="sizer">
        <div id="frame">
          <canvas id="canvas" tabindex="0" aria-label="Preview"></canvas>
          <div id="overlay"></div>
        </div>
      </div>
    </div>
    <div id="status"></div>
  </main>
  <div class="dock" id="dock-right">
    <section class="panel" data-panel="inspector" data-title="Properties and C code">
      <header class="panel-head">
        <span class="grip" title="Drag to move the panel"></span>
        <div class="tabs" role="tablist">
          <button data-tab="props" class="on">Properties</button>
          <button data-tab="code">C code</button>
        </div>
      </header>
      <div id="props"></div>
      <pre id="code" hidden></pre>
    </section>
  </div>
</div>
<div id="ghost" hidden></div>
<div id="dock-hint" hidden></div>
<datalist id="icons"></datalist>
<datalist id="sizes"><option value="fit"><option value="fill"><option value="200"><option value="50%"></datalist>
{{bootstrap}}
<script nonce="{{nonce}}" src="{{media}}/components.js"></script>
<script nonce="{{nonce}}" src="{{media}}/codegen.js"></script>
<script nonce="{{nonce}}" type="module" src="{{media}}/designer.js"></script>
</body>
</html>
